[package]
name = "easyhttpmock-vetis-smol"
version = "0.1.2-beta.3"
edition = "2024"
authors = ["Rogerio Araújo <rogerio.araujo@gmail.com>"]
repository = "https://github.com/ararog/easyhttpmock"
homepage = "https://github.com/ararog/easyhttpmock"
description = "EasyHttpMock adapter for Vetis HTTP server using tokio runtime."
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["http", "mock", "testing"]
publish = true
rust-version = "1.85.0"

[package.metadata.docs.rs]
all-features = true

[features]
default = [
  "http2",
  #"http3"
]

xml = ["easyhttpmock/xml"]
json = ["easyhttpmock/json"]
http2 = ["vetis-smol/http2"]
http3 = ["vetis-smol/http3"]

rust-tls = ["vetis-smol/rust-tls"]

[dependencies]
caramelo = { version = "0.1.5" }
easyhttpmock = { version = "0.1.5-beta.2" }
http = "1.5.0"
http-body-util = "0.1.5"
macro_rules_attribute = "0.2.2"
smol-macros = { version = "0.1.1", default-features = false }
vetis-smol = { version = "0.1.2-beta.4", features = [
  "http2",
  #"http3",
  "rust-tls",
], default-features = false }

[dev-dependencies]
deboa = { version = "0.1.5-beta.5" }
deboa-smol = { version = "0.1.4-beta.4", default-features = false, features = [
  "http2",
  #"http3",
  "rust-tls",
  "default-rustls-provider",
  "default-rustls-verifier",
] }
smol = { version = "2.0.2", default-features = false }
smol-macros = { version = "0.1.1", default-features = false }
